<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karang Taruna Bojong Lio Unit 28 - Merajut Realita & Mimpi</title>
    <link rel="icon" type="image/x-icon" href="images/logo-karang-taruna.png">
    
    <!-- SEO Meta Tags Dasar -->
    <meta name="description" content="Website resmi Karang Taruna Unit 28 Kampung Bojong Lio. Wadah pemuda kreatif yang merajut realita dan mimpi demi memajukan kampung melalui aksi sosial dan seni.">
    <meta name="keywords" content="Karang Taruna, Unit 28, Bojong Lio, Kepemudaan, Sukamaju, Depok, Kegiatan Sosial, Kerja Bakti, Kampung Bojong Lio, Katar Unit 28">
    <meta name="author" content="Karang Taruna Unit 28">
    <meta name="robots" content="index, follow">
    
    <!-- SEO Open Graph (Biar keren saat link dibagikan di WhatsApp/Medsos) -->
    <meta property="og:title" content="Karang Taruna Bojong Lio Unit 28">
    <meta property="og:description" content="Kumpulan pemuda yang merajut realita dan mimpi demi memajukan kampung Bojong Lio.">
    <!-- <meta property="og:image" content="images/og-image.jpg"> -->
    <meta property="og:url" content="https://bojonglio28.com"> <!-- Ganti dengan domain asli nanti -->
    <meta property="og:type" content="website">

    <!-- Google Fonts: Gaegu, Press Start 2P, VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Hidden YouTube Player -->
    <div id="ytplayer" style="display: none;"></div>

    <!-- Decorative sprites -->
    <div class="sprite sprite-sun"><i class="fas fa-sun"></i></div>
    <div class="sprite sprite-cloud"><i class="fas fa-cloud"></i></div>
    <div class="sprite sprite-star"><i class="fas fa-star"></i></div>
    <div class="sprite sprite-leaf"><i class="fas fa-leaf"></i></div>
    <div class="sprite sprite-heart"><i class="fas fa-heart"></i></div>
    <div class="sprite sprite-bubble"><i class="fas fa-comment-dots"></i></div>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <img src="logo-karang-taruna.png" alt="Logo">
            <span data-i18n="nav_title">Katar Unit 28</span>
        </div>
        <div class="nav-right">
            <div class="nav-links">
                <a href="#home" data-i18n="nav_home">Home</a>
                <a href="#about" data-i18n="nav_about">About</a>
                <a href="#gallery" data-i18n="nav_gallery">Gallery</a>
                <a href="#event" data-i18n="nav_event">Event</a>
                <a href="#project" data-i18n="nav_project">Project</a>
                <a href="#software" data-i18n="nav_software">Software</a>
                <a href="#team" data-i18n="nav_divisi">Divisi</a>
                <a href="#contact" data-i18n="nav_contact">Contact</a>
            </div>
            <div class="lang-switch">
                <button class="lang-btn" onclick="cycleLang()" title="Ubah Bahasa">
                    <i class="fas fa-globe"></i> <span id="currentLangLabel">ID</span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Bottom Navigation -->
    <div class="nav-bottom">
        <a href="#home"><i class="fas fa-home"></i><span data-i18n="nav_home">Home</span></a>
        <a href="#about"><i class="fas fa-info-circle"></i><span data-i18n="nav_about">About</span></a>
        <a href="#gallery"><i class="fas fa-images"></i><span data-i18n="nav_gallery">Gallery</span></a>
        <a href="#event"><i class="fas fa-calendar-day"></i><span data-i18n="nav_event">Event</span></a>
        <a href="#project"><i class="fas fa-flag"></i><span data-i18n="nav_project">Project</span></a>
        <a href="#software"><i class="fas fa-laptop-code"></i><span data-i18n="nav_software">Software</span></a>
        <a href="#team"><i class="fas fa-users"></i><span data-i18n="nav_divisi">Divisi</span></a>
        <a href="#contact"><i class="fas fa-envelope"></i><span data-i18n="nav_contact">Contact</span></a>
    </div>

    <!-- Komponen HTML dimuat di sini oleh componentLoader.js -->
    <div id="app"></div>

    <!-- Audio Controls Widget -->
    <div class="audio-widget">
        <button onclick="togglePlay()"><i id="playPauseIcon" class="fas fa-play"></i></button>
        <div class="vol-container">
            <span class="vol-label">VOL</span>
            <input type="range" class="vol-slider" min="0" max="100" value="50" oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- Scripts -->
    <!-- Pustaka eksternal -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Data (hardcode, bisa diedit manual) -->
    <script src="js/data/config.js"></script>
    <script src="js/data/translations.js"></script>
    <script src="js/data/divisions.js"></script>
    <script src="js/data/quests.js"></script>
    <script src="js/data/memories.js"></script>
    <script src="js/data/events.js"></script>
    <script src="js/data/software.js"></script>
    <script src="js/data/coreteam.js"></script>

    <!-- Component Loader (harus sebelum func lainnya) -->
    <script src="js/func/componentLoader.js"></script>

    <!-- Fungsi -->
    <script src="js/func/audio-sfx.js"></script>
    <script src="js/func/youtube.js"></script>
    <script src="js/func/i18n.js"></script>
    <script src="js/func/team.js"></script>
    <script src="js/func/quests.js"></script>
    <script src="js/func/gallery.js"></script>
    <script src="js/func/events.js"></script>
    <script src="js/func/software.js"></script>
    <script src="js/func/about.js"></script>
    <script src="js/func/typewriter.js"></script>
    <script src="js/func/contact.js"></script>
    <script src="js/func/main.js"></script>
</body>
</html>
