<!-- Contact Section -->
<section id="contact">
    <div style="text-align: center; width: 100%; margin-bottom: 30px;">
        <h2 class="section-title" data-i18n="contact_title">CONTACT US</h2>
    </div>
    
    <div style="display: flex; gap: 30px; justify-content: center; width: 100%; max-width: 1000px; margin: 0 auto; flex-wrap: wrap;">
        
        <!-- Instagram Card -->
        <div class="omori-box ig-card" style="flex: 1; min-width: 300px; background: var(--hs-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.transform='scale(1.03) rotate(-2deg)'; this.style.background='var(--hs-yellow)';" onmouseout="this.style.transform='scale(1) rotate(0deg)'; this.style.background='var(--hs-blue)';" onclick="window.open('https://www.instagram.com/karangtarunaunit28/', '_blank')">
            <i class="fab fa-instagram" style="font-size: 6rem; color: #E1306C; margin-bottom: 20px; text-shadow: 3px 3px 0px var(--hs-white);"></i>
            <h3 style="font-size: 2.5rem; margin-bottom: 10px;">INSTAGRAM</h3>
            <p style="font-family: 'Gaegu', cursive; font-size: 1.5rem; font-weight: bold;">@karangtarunaunit28</p>
            <p style="margin-top: 15px; font-size: 1.2rem; font-family: 'VT323', monospace; background: var(--hs-white); border: 2px solid var(--hs-border); padding: 5px 15px; border-radius: 10px;"><i class="fas fa-hand-pointer"></i> Follow Us!</p>
        </div>

        <!-- Contact Form -->
        <div class="contact-box omori-box" style="flex: 2; min-width: 300px; margin: 0;">
            <div class="form-group">
                <label data-i18n="contact_name_label">Nama Anda:</label>
                <input type="text" id="name" data-i18n-placeholder="contact_name_placeholder" placeholder="Siapa namamu?">
            </div>
            <div class="form-group">
                <label data-i18n="contact_msg_label">Pesan:</label>
                <textarea id="message" rows="5" data-i18n-placeholder="contact_msg_placeholder" placeholder="Apa yang ingin kamu sampaikan?"></textarea>
            </div>
            <button class="action-btn" style="width: 100%; margin-top: 10px;" onclick="sendToWA()" data-i18n="contact_btn">SEND MESSAGE</button>
        </div>
        
    </div>
</section>
